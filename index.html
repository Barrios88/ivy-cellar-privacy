<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ivy Cellar</title>
<style>
  :root { --page: #F5EFE4; --ink: #2A211A; --soft: #5F544A; --accent: #8A2A3D; }
  @media (prefers-color-scheme: dark) { :root { --page: #17130F; --ink: #F3EDE3; --soft: #B9ADA0; --accent: #E39AAA; } }
  body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-family: Georgia, "New York", serif; font-weight: 600; font-size: 34px; margin: 0 0 8px; }
  p { color: var(--soft); margin: 0 0 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>The Ivy Cellar</h1>
<p>A private wine-cellar app for iPhone and Mac: your bottles and when to drink them, a vintage chart, an atlas of vineyards, and a way to compare cellars with friends.</p>
<p>It's in a small private beta through TestFlight.</p>
<p><a href="/privacy/">Privacy policy</a></p>
</main>
</body>
</html>
